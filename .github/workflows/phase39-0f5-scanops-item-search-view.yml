name: Phase 39-0F5 ScanOps Item Search and View

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/Scan.jsx'
      - 'src/lib/scanOpsLiveConnectivity.js'
      - 'src/inventory-bridge/itemLookup/v1/**'
      - 'scripts/validate-phase39-0f5-scanops-item-search-view.mjs'
      - 'scripts/validate-phase39-0e-operational-item-lookup.mjs'
      - 'scripts/validate-phase39-0e1-connection-scope-consistency.mjs'
      - 'scripts/validate-phase39-0d-read-only-item-lookup.mjs'
      - 'docs/bridge/PHASE_39_0F5_SCANOPS_ITEM_SEARCH_VIEW.md'
      - '.github/workflows/phase39-0f5-scanops-item-search-view.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Phase 39-0F5 ScanOps item search and view
        run: node scripts/validate-phase39-0f5-scanops-item-search-view.mjs

      - name: Phase 39-0E operational lookup compatibility
        run: node scripts/validate-phase39-0e-operational-item-lookup.mjs

      - name: Phase 39-0E.1 connection scope compatibility
        run: node scripts/validate-phase39-0e1-connection-scope-consistency.mjs

      - name: Phase 39-0D exact lookup compatibility
        run: node scripts/validate-phase39-0d-read-only-item-lookup.mjs

      - name: Canonical contract compatibility
        run: node scripts/validate-scanops-bridge-canonical-contract-v1.mjs

      - name: Canonical adapter compatibility
        run: node scripts/validate-scanops-bridge-canonical-adapter-v1.mjs

      - name: Phase 35-A transport compatibility
        run: node scripts/validate-phase35a-scanops-test-transport.mjs

      - name: Phase 36-A pairing compatibility
        run: node scripts/validate-phase36a-scanops-ephemeral-pairing.mjs

      - name: Phase 39-0B connection compatibility
        run: node scripts/validate-phase39-0b-scanops-connection-setup.mjs

      - name: Install and build application
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run build

      - name: Lint Phase 39-0F5 changed surfaces
        run: |
          set -euo pipefail
          npx eslint \
            src/pages/Scan.jsx \
            src/lib/scanOpsLiveConnectivity.js \
            src/inventory-bridge/itemLookup/v1/scanOpsItemLookupClientV1.js \
            src/inventory-bridge/itemLookup/v1/validateScanOpsItemLookupReceiptV1.js \
            --quiet

      - name: Record controlled quality baseline
        run: |
          cat > scanops-phase39-0f5-quality-note.json <<'JSON'
          {
            "status": "TARGETED_PHASE_GATE",
            "full_typecheck_gate": false,
            "reason": "ScanOps main retains unrelated checkJs debt; Phase 39-0F5 requires deterministic certification, application build, targeted lint, and prior bridge compatibility validators.",
            "canonical_transport_operation": "LOOKUP_REQUEST",
            "governed_read_operations": ["ITEM_SEARCH_REQUEST", "ITEM_VIEW_REQUEST"],
            "automatic_selection_added": false,
            "local_lookup_restored": false,
            "receiving_authorized": false,
            "mutation_authority_added": false
          }
          JSON

      - name: Upload Phase 39-0F5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase39-0f5-scanops-item-search-view
          path: |
            scanops-phase39-0f5-quality-note.json
          if-no-files-found: warn
          retention-days: 30
