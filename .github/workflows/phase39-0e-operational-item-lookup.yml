name: Phase 39-0E Operational Item Lookup

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/Scan.jsx'
      - 'src/lib/scanOpsLiveConnectivity.js'
      - 'src/inventory-bridge/itemLookup/**'
      - 'src/inventory-bridge/pairing/browser/v1/scanOpsBrowserPairingClientV1.js'
      - 'scripts/validate-phase39-0e-operational-item-lookup.mjs'
      - 'scripts/validate-phase39-0d-read-only-item-lookup.mjs'
      - 'scripts/validate-phase39-0d-read-only-item-lookup-source-boundary.mjs'
      - 'docs/bridge/PHASE_39_0E_OPERATIONAL_ITEM_LOOKUP.md'
      - 'docs/bridge/phase39-0e-operational-item-lookup.certification.json'
      - '.github/workflows/phase39-0e-operational-item-lookup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Phase 39-0E operational item lookup
        run: |
          set -o pipefail
          node scripts/validate-phase39-0e-operational-item-lookup.mjs | tail -n 180

      - name: Phase 39-0D read-only lookup compatibility
        run: node scripts/validate-phase39-0d-read-only-item-lookup.mjs

      - name: Phase 39-0D source boundary compatibility
        run: node scripts/validate-phase39-0d-read-only-item-lookup-source-boundary.mjs

      - name: Canonical contract compatibility
        run: node scripts/validate-scanops-bridge-canonical-contract-v1.mjs

      - name: Canonical adapter compatibility
        run: node scripts/validate-scanops-bridge-canonical-adapter-v1.mjs

      - name: Phase 35-A transport compatibility
        run: node scripts/validate-phase35a-scanops-test-transport.mjs

      - name: Phase 36-A pairing compatibility
        run: node scripts/validate-phase36a-scanops-ephemeral-pairing.mjs

      - name: Phase 39-0B connection compatibility
        run: node scripts/validate-phase39-0b-scanops-connection-setup.mjs

      - name: Install and build application
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run build

      - name: Lint Phase 39-0E changed surfaces
        run: |
          set -euo pipefail
          npx eslint \
            src/pages/Scan.jsx \
            src/lib/scanOpsLiveConnectivity.js \
            src/inventory-bridge/itemLookup/v1/scanOpsItemLookupClientV1.js \
            src/inventory-bridge/itemLookup/v1/validateScanOpsItemLookupReceiptV1.js \
            --quiet

      - name: Record controlled quality baseline
        run: |
          cat > scanops-phase39-0e-quality-note.json <<'JSON'
          {
            "status": "TARGETED_PHASE_GATE",
            "full_typecheck_gate": false,
            "reason": "ScanOps main retains unrelated checkJs debt; Phase 39-0E requires deterministic certification, application build, targeted lint, and all prior connection and lookup compatibility validators.",
            "local_lookup_retired_from_operational_path": true,
            "receiving_authorized": false,
            "mutation_authority_added": false
          }
          JSON

      - name: Upload Phase 39-0E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase39-0e-scanops-operational-item-lookup
          path: scanops-phase39-0e-quality-note.json
          if-no-files-found: warn
          retention-days: 30
