name: Phase 36-A Cross-Repository Ephemeral Pairing

on:
  pull_request:
    paths:
      - 'src/inventory-bridge/pairing/v1/**'
      - 'src/inventory-bridge/testTransport/v1/**'
      - 'src/inventory-bridge/canonicalAdapter/v1/**'
      - 'src/inventory-bridge/canonicalContract/v1/**'
      - 'scripts/validate-phase36a-scanops-ephemeral-pairing.mjs'
      - 'scripts/validate-phase36a-cross-repository-pairing.mjs'
      - '.github/workflows/phase36a-cross-repository-ephemeral-pairing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      INVENTORY_PHASE36A_SHA: 361dd238780c088f81e88ad1102543dfc2d293f0
    steps:
      - name: Verify Inventory repository read token
        env:
          INVENTORY_REPO_READ_TOKEN: ${{ secrets.INVENTORY_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${INVENTORY_REPO_READ_TOKEN}" ]; then
            echo "::error::INVENTORY_REPO_READ_TOKEN is required for exact private cross-repository certification."
            exit 1
          fi

      - name: Checkout ScanOps candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: scanops-repo
          persist-credentials: false

      - name: Checkout certified Inventory Phase 36-A candidate
        uses: actions/checkout@v4
        with:
          repository: chrykoolaid/invyra-base44
          ref: ${{ env.INVENTORY_PHASE36A_SHA }}
          token: ${{ secrets.INVENTORY_REPO_READ_TOKEN }}
          path: scanops-repo/inventory-repo
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Capture candidate commit evidence
        run: |
          set -euo pipefail
          scanops_sha="$(git -C scanops-repo rev-parse HEAD)"
          inventory_sha="$(git -C scanops-repo/inventory-repo rev-parse HEAD)"
          test "${inventory_sha}" = "${INVENTORY_PHASE36A_SHA}"
          printf '{\n  "scanOpsCommit": "%s",\n  "inventoryCommit": "%s"\n}\n' \
            "${scanops_sha}" "${inventory_sha}" \
            | tee scanops-repo/phase36a-cross-repository-commits.json

      - name: Validate ScanOps locked baseline and pairing client
        working-directory: scanops-repo
        run: |
          set -euo pipefail
          node scripts/validate-scanops-bridge-canonical-contract-v1.mjs
          node scripts/validate-scanops-bridge-canonical-adapter-v1.mjs
          node scripts/validate-phase35a-scanops-test-transport.mjs
          node scripts/validate-phase35a-scanops-invalid-host.mjs
          node scripts/validate-phase36a-scanops-ephemeral-pairing.mjs \
            | tee phase36a-scanops-ephemeral-pairing-report.json

      - name: Validate Inventory locked baseline and pairing authority
        working-directory: scanops-repo/inventory-repo
        run: |
          set -euo pipefail
          node scripts/validate-inventory-bridge-canonical-contract-v1.mjs
          node scripts/validate-inventory-bridge-canonical-adapter-v1.mjs
          node scripts/validate-phase35a-inventory-test-transport.mjs
          node scripts/validate-phase36a-inventory-ephemeral-pairing.mjs \
            | tee phase36a-inventory-ephemeral-pairing-report.json

      - name: Run actual pairing-to-health cross-repository certification
        working-directory: scanops-repo
        run: |
          set -euo pipefail
          node scripts/validate-phase36a-cross-repository-pairing.mjs \
            | tee phase36a-cross-repository-pairing-report.json

      - name: Upload Phase 36-A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase36a-cross-repository-ephemeral-pairing
          path: |
            scanops-repo/phase36a-cross-repository-commits.json
            scanops-repo/phase36a-scanops-ephemeral-pairing-report.json
            scanops-repo/inventory-repo/phase36a-inventory-ephemeral-pairing-report.json
            scanops-repo/phase36a-cross-repository-pairing-report.json
          if-no-files-found: warn
          retention-days: 30
