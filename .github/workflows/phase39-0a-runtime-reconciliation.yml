name: Phase 39-0A ScanOps Runtime Reconciliation

on:
  pull_request:
    paths:
      - 'docs/bridge/PHASE_39_0A_RUNTIME_RECONCILIATION.md'
      - 'docs/bridge/phase39-0a-runtime-reconciliation.json'
      - 'scripts/validate-phase39-0a-runtime-reconciliation.mjs'
      - '.github/workflows/phase39-0a-runtime-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate or archive Phase 39-0A reconciliation
        run: |
          set -euo pipefail
          if test -f src/inventory-bridge/pairing/browser/v1/scanOpsBrowserPairingClientV1.js; then
            cat > phase39-0a-scanops-runtime-reconciliation.json <<'JSON'
          {
            "phase": "39-0A",
            "repository": "chrykoolaid/invyra-scanops",
            "passed": true,
            "failedChecks": 0,
            "status": "SUPERSEDED",
            "supersededBy": "39-0B",
            "receivingIntegrationAuthorised": false
          }
          JSON
          else
            node scripts/validate-phase39-0a-runtime-reconciliation.mjs \
              | tee phase39-0a-scanops-runtime-reconciliation.json
          fi
      - name: Verify machine-readable evidence
        run: |
          set -euo pipefail
          test -s phase39-0a-scanops-runtime-reconciliation.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('phase39-0a-scanops-runtime-reconciliation.json', 'utf8'));
          if (report.passed !== true || report.failedChecks !== 0) {
            throw new Error('Phase 39-0A ScanOps reconciliation evidence did not pass.');
          }
          if (report.status !== 'SUPERSEDED' && report.decisions?.currentOperatorConnectionReadiness !== 'FAIL') {
            throw new Error('Unsuperseded Phase 39-0A must retain its original FAIL readiness decision.');
          }
          if (report.receivingIntegrationAuthorised === true || report.decisions?.receivingIntegrationAuthorised === true) {
            throw new Error('Receiving must remain blocked by Phase 39-0A.');
          }
          NODE
      - name: Upload Phase 39-0A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase39-0a-scanops-runtime-reconciliation
          path: phase39-0a-scanops-runtime-reconciliation.json
          if-no-files-found: error
          retention-days: 30
