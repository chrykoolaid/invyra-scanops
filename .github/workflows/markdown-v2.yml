name: Markdown V2

on:
  pull_request:
    paths:
      - "src/pages/MarkdownsOperator.jsx"
      - "src/pages/MarkdownMonitor.jsx"
      - "src/lib/scanOpsMarkdown*.js"
      - "scripts/validate-scanops-markdown-v2.mjs"
      - "src/App.jsx"
      - "src/pages/More.jsx"
      - ".github/workflows/markdown-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Markdown V2 contracts
        run: node scripts/validate-scanops-markdown-v2.mjs

      - name: Build ScanOps
        run: npm run build
