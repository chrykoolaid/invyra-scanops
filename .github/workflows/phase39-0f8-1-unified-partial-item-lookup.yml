name: Phase 39-0F8.1 Unified Partial Item Lookup

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/Scan.jsx'
      - 'src/components/scanner/itemLookup/**'
      - 'scripts/validate-phase39-0f8-1-unified-partial-item-lookup.mjs'
      - 'scripts/validate-phase39-0f8-current-main-item-lookup-reconciliation.mjs'
      - 'evidence/phase39-0f8-1-unified-partial-item-lookup-acceptance.template.json'
      - 'docs/bridge/PHASE_39_0F8_1_UNIFIED_PARTIAL_ITEM_LOOKUP.md'
      - '.github/workflows/phase39-0f8-1-unified-partial-item-lookup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INVENTORY_BASELINE_SHA: 4346c8895b38b35006eba5d4d763ed32f2548cc0
      SCANOPS_BASE_SHA: 52b2b6f4711ca87e031b05d1b3028daa402698d2
    steps:
      - name: Checkout ScanOps candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Record pinned baselines
        run: |
          set -euo pipefail
          printf '{\n  "scanOpsCandidate": "%s",\n  "scanOpsBase": "%s",\n  "inventoryBaseline": "%s",\n  "realWindowsChromeAcceptanceRequired": true\n}\n' \
            "$(git rev-parse HEAD)" "${SCANOPS_BASE_SHA}" "${INVENTORY_BASELINE_SHA}" \
            | tee phase39-0f8-1-baselines.json

      - name: Unified partial item lookup validation
        run: node scripts/validate-phase39-0f8-1-unified-partial-item-lookup.mjs

      - name: Phase 39-0F8 compatibility
        run: node scripts/validate-phase39-0f8-current-main-item-lookup-reconciliation.mjs

      - name: Phase 39-0F5 governed search and view compatibility
        run: node scripts/validate-phase39-0f5-scanops-item-search-view.mjs

      - name: Phase 39-0F7 operator acceptance kit compatibility
        run: node scripts/validate-phase39-0f7-real-local-operator-acceptance-kit.mjs

      - name: Canonical bridge contract compatibility
        run: node scripts/validate-scanops-bridge-canonical-contract-v1.mjs

      - name: Canonical adapter compatibility
        run: node scripts/validate-scanops-bridge-canonical-adapter-v1.mjs

      - name: Phase 35-A transport compatibility
        run: node scripts/validate-phase35a-scanops-test-transport.mjs

      - name: Phase 36-A pairing compatibility
        run: node scripts/validate-phase36a-scanops-ephemeral-pairing.mjs

      - name: Phase 39-0B connection compatibility
        run: node scripts/validate-phase39-0b-scanops-connection-setup.mjs

      - name: Install and build application
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run build

      - name: Lint unified lookup surfaces
        run: |
          set -euo pipefail
          npx eslint \
            src/pages/Scan.jsx \
            src/components/scanner/itemLookup/ItemLookupSearch.jsx \
            src/components/scanner/itemLookup/itemLookupHelpers.js \
            scripts/validate-phase39-0f8-1-unified-partial-item-lookup.mjs \
            --quiet

      - name: Record controlled quality evidence
        run: |
          cat > phase39-0f8-1-quality-note.json <<'JSON'
          {
            "phase": "39-0F8.1",
            "status": "AUTOMATED_CERTIFICATION_ONLY",
            "unifiedLookupField": true,
            "oneLetterNameSearchAccepted": true,
            "threeLetterPrefixSearchAccepted": true,
            "resultPageLimit": 20,
            "automaticCandidateSelection": false,
            "automaticExactOpen": false,
            "automaticExactToNameFallback": false,
            "receivingIntegrationAuthorized": false,
            "liveAuthorized": false,
            "productionAuthorized": false,
            "realWindowsChromeAcceptanceRequired": true
          }
          JSON

      - name: Upload Phase 39-0F8.1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase39-0f8-1-unified-partial-item-lookup
          path: |
            phase39-0f8-1-baselines.json
            phase39-0f8-1-quality-note.json
            evidence/phase39-0f8-1-unified-partial-item-lookup-acceptance.template.json
          if-no-files-found: warn
          retention-days: 30
