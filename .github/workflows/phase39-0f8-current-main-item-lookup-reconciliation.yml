name: Phase 39-0F8 Current-Main Item Lookup Reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/Scan.jsx'
      - 'src/components/scanner/itemLookup/**'
      - 'src/lib/scanOpsLiveConnectivity.js'
      - 'src/inventory-bridge/itemLookup/v1/**'
      - 'scripts/validate-phase39-0f5-scanops-item-search-view.mjs'
      - 'scripts/validate-phase39-0f6-cross-repository-item-read-acceptance.mjs'
      - 'scripts/validate-phase39-0f7-real-local-operator-acceptance-kit.mjs'
      - 'scripts/validate-phase39-0f8-current-main-item-lookup-reconciliation.mjs'
      - 'evidence/phase39-0f8-current-main-item-lookup-acceptance.template.json'
      - 'docs/bridge/PHASE_39_0F8_CURRENT_MAIN_ITEM_LOOKUP_RECONCILIATION.md'
      - '.github/workflows/phase39-0f8-current-main-item-lookup-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INVENTORY_CURRENT_MAIN_SHA: 4346c8895b38b35006eba5d4d763ed32f2548cc0
    steps:
      - name: Checkout ScanOps candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Inventory repository read token
        env:
          INVENTORY_REPO_READ_TOKEN: ${{ secrets.INVENTORY_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${INVENTORY_REPO_READ_TOKEN}" || {
            echo "::error::INVENTORY_REPO_READ_TOKEN is required."
            exit 1
          }

      - name: Checkout current Inventory main baseline
        uses: actions/checkout@v4
        with:
          repository: chrykoolaid/invyra-base44
          ref: ${{ env.INVENTORY_CURRENT_MAIN_SHA }}
          token: ${{ secrets.INVENTORY_REPO_READ_TOKEN }}
          path: inventory-repo
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify pinned Inventory baseline
        run: |
          set -euo pipefail
          inventory_sha="$(git -C inventory-repo rev-parse HEAD)"
          test "${inventory_sha}" = "${INVENTORY_CURRENT_MAIN_SHA}"
          printf '{\n  "scanOpsCommit": "%s",\n  "inventoryCommit": "%s"\n}\n' \
            "$(git rev-parse HEAD)" "${inventory_sha}" \
            | tee phase39-0f8-current-main-commits.json

      - name: Phase 39-0F8 current-main reconciliation
        run: node scripts/validate-phase39-0f8-current-main-item-lookup-reconciliation.mjs

      - name: Phase 39-0F5 governed item search and view compatibility
        run: node scripts/validate-phase39-0f5-scanops-item-search-view.mjs

      - name: Phase 39-0F6 cross-repository item read compatibility
        env:
          INVENTORY_REPO_PATH: inventory-repo
        run: node scripts/validate-phase39-0f6-cross-repository-item-read-acceptance.mjs

      - name: Phase 39-0F7 operator acceptance kit compatibility
        run: node scripts/validate-phase39-0f7-real-local-operator-acceptance-kit.mjs

      - name: Canonical bridge contract compatibility
        run: node scripts/validate-scanops-bridge-canonical-contract-v1.mjs

      - name: Canonical adapter compatibility
        run: node scripts/validate-scanops-bridge-canonical-adapter-v1.mjs

      - name: Phase 35-A transport compatibility
        run: node scripts/validate-phase35a-scanops-test-transport.mjs

      - name: Phase 36-A pairing compatibility
        run: node scripts/validate-phase36a-scanops-ephemeral-pairing.mjs

      - name: Phase 39-0B connection compatibility
        run: node scripts/validate-phase39-0b-scanops-connection-setup.mjs

      - name: Install and build application
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run build

      - name: Lint reconciled Item Lookup surfaces
        run: |
          set -euo pipefail
          npx eslint \
            src/pages/Scan.jsx \
            src/components/scanner/itemLookup/ItemLookupSearch.jsx \
            src/components/scanner/itemLookup/ItemSearchResults.jsx \
            src/components/scanner/itemLookup/ItemDetailHeader.jsx \
            src/components/scanner/itemLookup/PriorityCards.jsx \
            src/components/scanner/itemLookup/SummaryTab.jsx \
            src/components/scanner/itemLookup/InventoryTab.jsx \
            src/components/scanner/itemLookup/LocationsTab.jsx \
            src/components/scanner/itemLookup/SalesTab.jsx \
            src/components/scanner/itemLookup/QuickActions.jsx \
            --quiet

      - name: Record controlled quality baseline
        run: |
          cat > scanops-phase39-0f8-quality-note.json <<'JSON'
          {
            "phase": "39-0F8",
            "status": "AUTOMATED_CERTIFICATION_ONLY",
            "inventoryBaseline": "4346c8895b38b35006eba5d4d763ed32f2548cc0",
            "scanOpsBase": "e7ea23e3a219ba26f874eefbad5f54d4856f7632",
            "explicitExactOpenRequired": true,
            "automaticNotFoundFallback": false,
            "automaticCandidateSelection": false,
            "unsupportedStockProjection": false,
            "unsupportedLocationProjection": false,
            "syntheticSalesProjection": false,
            "receivingIntegrationAuthorized": false,
            "liveAuthorized": false,
            "productionAuthorized": false,
            "realWindowsChromeAcceptanceRequired": true
          }
          JSON

      - name: Upload Phase 39-0F8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase39-0f8-current-main-item-lookup-reconciliation
          path: |
            phase39-0f8-current-main-commits.json
            scanops-phase39-0f8-quality-note.json
            evidence/phase39-0f8-current-main-item-lookup-acceptance.template.json
          if-no-files-found: warn
          retention-days: 30
